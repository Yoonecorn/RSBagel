[workspace]
members = ["crates/rsbagel-core", "crates/rsbagel-cli", "crates/rsbagel-ffi"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.20"
csv = "=1.3.1"
rayon = "=1.12.0"
rand = "=0.8.8"
rand_chacha = "=0.3.1"
clap = { version = "=4.5.26", features = ["derive"] }
