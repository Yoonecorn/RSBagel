name: Routine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Confirm architecture
        run: test "$(uname -m)" = arm64
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Routine tests (ignored scientific tests remain excluded)
        run: cargo test --workspace --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Beginner example
        run: |
          mkdir -p examples/beginner/bin
          cp target/aarch64-apple-darwin/release/rsbagel examples/beginner/bin/rsbagel
          cd examples/beginner
          ./run-example.sh
      - run: python3 scripts/check_doc_links.py
      - name: Validate citation schema
        run: |
          python3 -m venv "$RUNNER_TEMP/cff-env"
          "$RUNNER_TEMP/cff-env/bin/pip" install cffconvert==2.0.0
          "$RUNNER_TEMP/cff-env/bin/cffconvert" --validate
